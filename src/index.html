<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>yamma-hl-api rollup browser example</title>
        <link rel="icon" href="data:;base64,=" />
        <link rel="stylesheet" href="gh-fork-ribbon.css" />
        <script type="module" src="index.js"></script>
        <style>
            .section {
                padding-bottom: 20px;
            }

            textarea {
                width: 640px;
                height: 175px;
            }
        </style>
    </head>
    <body>
        <a
            class="github-fork-ribbon right-top"
            href="https://github.com/Antony74/yamma-hl-api-rollup-browser-example"
            data-ribbon="Fork me on GitHub"
            title="Fork me on GitHub"
        >
            Fork me on GitHub
        </a>

        <h1>yamma-hl-api rollup browser example</h1>
        <div class="section">
            <textarea
                id="mmEditor"
                aria-label="MM Editor"
                spellcheck="false"
            ></textarea>
            <div>
                <button id="parseButton">Parse</button>
                <span id="parseOutput"></span>
            </div>
        </div>

        <div class="section">
            <textarea
                id="mmpEditor"
                aria-label="MMP Editor"
                spellcheck="false"
            ></textarea>
            <div>
                <button id="unifyButton">Unify</button>
                <span id="unifierOutput"></span>
            </div>
        </div>
    </body>
</html>
